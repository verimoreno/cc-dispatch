limit_req_zone $binary_remote_addr zone=dispatch:1m rate=5r/m;

server {
    listen 80;
    server_name dispatch.wearefractional.ai;

    # Keep ACME renewals on plain HTTP — Cloudflare passes /.well-known/ through to origin:80.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Everything else → HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dispatch.wearefractional.ai;

    ssl_certificate     /etc/letsencrypt/live/dispatch.wearefractional.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispatch.wearefractional.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only ONE route is reachable from the public internet, and it is the only
    # route in main.py that requires the bearer token (@secure_router, main.py:731).
    #
    # Everything else on the bridge — POST /api/sessions (spawn) and
    # POST /api/sessions/{id}/prompt (inject a prompt into a live Claude Code
    # session with repo access) — is on bare @app with NO authentication. Those
    # are safe only because the tailnet is the boundary. Widening this back to
    # `location /` publishes unauthenticated remote code execution. Don't.
    location = /api/sessions/from-task {
        limit_req zone=dispatch burst=3 nodelay;
        client_max_body_size 64k;

        # Upstream is the host's Tailscale IP because deploy/install-on-host.sh
        # sets CC_DISPATCH_BIND=auto, and run.sh resolves that to `tailscale ip -4`
        # at each start. It is NOT on 127.0.0.1. The previous value here
        # (127.0.0.1:8000) is what silently broke dispatch from 2026-08-18 on:
        # nginx answered 502 and every veris_agent run died as "Dispatch failed".
        # If this host's Tailscale IP ever changes, update this line too.
        proxy_pass http://100.100.213.79:7822;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard, spawn and prompt injection stay tailnet-only:
    # http://cc-host-hel:7822/ over Tailscale.
    location / { return 404; }
}
