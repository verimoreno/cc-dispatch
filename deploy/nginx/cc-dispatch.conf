limit_req_zone $binary_remote_addr zone=dispatch:1m rate=5r/m;

server {
    listen 80;
    server_name dispatch.wearefractional.ai;

    # Keep ACME renewals on plain HTTP — Cloudflare passes /.well-known/ through to origin:80.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Everything else → HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dispatch.wearefractional.ai;

    ssl_certificate     /etc/letsencrypt/live/dispatch.wearefractional.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispatch.wearefractional.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Supabase webhook: the only route in main.py that checks the bearer
    # token itself (@secure_router), so it is the only one published without the
    # login below.
    location = /api/sessions/from-task {
        limit_req zone=dispatch burst=3 nodelay;
        client_max_body_size 64k;

        # Upstream is the host's Tailscale IP because deploy/install-on-host.sh
        # sets CC_DISPATCH_BIND=auto, and run.sh resolves that to `tailscale ip -4`
        # at each start. It is NOT on 127.0.0.1. The previous value here
        # (127.0.0.1:8000) is what silently broke dispatch from 2026-08-18 on:
        # nginx answered 502 and every veris_agent run died as "Dispatch failed".
        # If this host's Tailscale IP ever changes, update BOTH proxy_pass lines.
        proxy_pass http://100.100.213.79:7822;
    }

    # The dashboard. Everything behind it — POST /api/sessions (spawn) and
    # POST /api/sessions/{id}/prompt (inject a prompt into a live agent session
    # with repo access) — is on bare @app with NO authentication of its own, so
    # this auth_basic is the ONLY thing between the internet and remote code
    # execution. Never remove it, and keep the password machine-generated: nginx
    # has no lockout, so a guessable password is an open door.
    # Set / rotate it with the command in deploy/README.md.
    location / {
        auth_basic "cc-dispatch";
        auth_basic_user_file /etc/nginx/cc-dispatch.htpasswd;

        # Browsers replay saved basic-auth credentials on cross-site form posts,
        # so refuse anything a foreign page sent (CSRF).
        if ($http_origin !~ "^(https://dispatch\.wearefractional\.ai)?$") { return 403; }

        client_max_body_size 25m;   # phone screenshots → /api/sessions/{id}/image
        proxy_read_timeout 130s;    # cc-reap may take up to 120s
        add_header Cache-Control "private, no-store";  # keep Cloudflare from caching authed pages
        proxy_pass http://100.100.213.79:7822;
    }
}
