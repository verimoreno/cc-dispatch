<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* Committed dark theme — clean neutral graphite, no purple.
     ForHumans traces kept: olive kickers, the serif wordmark, the composition rules. */
  :root {
    --ground: #0e1116; --surface: #151a21; --surface-2: #1b222c;
    --ink: #e6e9ee; --ink-soft: #aab2bc; --ink-faint: #7a828c;
    --line: #262d36; --line-strong: #3a434e;
    --accent: #58a6ff; --accent-soft: rgba(88,166,255,0.13); --accent-edge: #3d70b8;
    --olive: #a3a180; --olive-ink: #b3b190;
    --danger: #f47067; --ok: #3fb950;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --wide: 1280px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .wrap { max-width: var(--wide); margin: 0 auto; padding: 0 28px; }

  /* top bar */
  .bar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .bar-in { display: flex; align-items: center; gap: 18px; height: 52px; }
  .bar-mark { font-family: var(--serif); font-size: 19px; }
  .bar-nav { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .bar-nav a {
    font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none; padding: 6px 12px;
    border-radius: 999px; border: 1px solid transparent;
  }
  .bar-nav a:hover { border-color: var(--line-strong); color: var(--ink); }
  #refresh-chip {
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 6px 13px; background: var(--surface); cursor: pointer;
  }
  #refresh-chip[data-err="1"] { color: var(--danger); border-color: var(--danger); }

  /* masthead */
  .mast { padding: 26px 0 20px; }
  .eyebrow {
    font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--olive-ink); font-weight: 600; margin: 0;
  }
  .mast h1 { font-family: var(--sans); font-weight: 700; letter-spacing: -0.02em;
    font-size: clamp(24px, 3vw, 32px); line-height: 1.05; margin: 10px 0 0; }
  .mast h1 em { font-style: normal; color: var(--accent); }

  /* KPI row — hero numbers, labels always present */
  .kpis {
    display: grid; gap: 14px; margin: 26px 0 8px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 16px 10px;
  }
  .kpi .n {
    font-family: var(--mono); font-weight: 500; font-size: 24px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .kpi .k {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--olive-ink); margin-top: 6px;
  }
  .kpi[data-tone="ok"] .n { color: var(--ok); }
  .kpi[data-tone="danger"] .n { color: var(--danger); }
  .kpi[data-tone="accent"] .n { color: var(--accent); }

  /* plan card */
  .plan {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px 16px; margin: 16px 0;
  }
  .plan-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .plan-head h2 { font-size: 15px; margin: 0; font-family: var(--mono); letter-spacing: 0; }
  .plan-head h2 span { color: var(--olive-ink); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 3px 11px;
    border-radius: 999px; border: 1px solid currentColor;
  }
  .badge.st-active { color: var(--ok); }
  .badge.st-closed { color: var(--ink-faint); }
  .badge.plain { color: var(--ink-faint); font-weight: 500; border-color: var(--line-strong); }
  .goal {
    font-size: 14px; color: var(--ink-soft); line-height: 1.55;
    margin: 10px 0 2px; max-width: 78ch;
  }
  .plan-meta {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
    margin-bottom: 6px;
  }

  /* the dependency board */
  .board {
    position: relative; display: flex; gap: 48px; align-items: flex-start;
    overflow-x: auto; padding: 14px 4px 8px;
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 250px; }
  .col-k {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .sess {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 13px; position: relative;
  }
  .sess-top { display: flex; align-items: center; gap: 8px; }
  .st {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor;
    font-family: var(--sans);
  }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .sess.working .st { color: var(--accent); }
  .sess.done .st { color: var(--ok); }
  .sess.blocked .st { color: var(--danger); }
  .sess.waiting-to-spawn .st, .sess.unknown .st, .sess.no-notes-yet .st { color: var(--ink-faint); }
  .sess.waiting-to-spawn { border-style: dashed; background: transparent; }
  .fresh {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .fresh i {
    width: 7px; height: 7px; border-radius: 999px; display: inline-block; font-style: normal;
    background: var(--ink-faint);
  }
  .fresh[data-age="fresh"] i { background: var(--ok); }
  .fresh[data-age="aging"] i { background: var(--olive); }
  .fresh[data-age="stale"] i { background: var(--danger); }
  .nm { font-family: var(--mono); font-size: 13px; margin-top: 9px; word-break: break-all; }
  .tk { font-size: 13.5px; color: var(--ink-soft); margin-top: 3px; max-width: 40ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .meta span {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
    background: var(--surface);
  }
  .meta span.ev-ok { color: var(--ok); border-color: currentColor; }
  .meta span.ev-bad { color: var(--danger); border-color: currentColor; }
  svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  /* view toggle (list | graph) */
  .vtoggle {
    display: inline-flex; gap: 2px; padding: 2px; margin-left: auto;
    background: var(--ground); border: 1px solid var(--line); border-radius: 8px;
  }
  .vtoggle button {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); background: none; border: none; border-radius: 6px;
    padding: 4px 12px; cursor: pointer;
  }
  .vtoggle button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }

  /* dependency graph view */
  .depwrap { overflow-x: auto; padding: 14px 4px 8px; }
  svg.depgraph { display: block; }

  /* attention + errors */
  .contras {
    margin-top: 14px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 16px;
  }
  .contras .kicker {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--danger); margin-bottom: 8px; font-weight: 600;
  }
  .contras div.row {
    font-size: 13.5px; color: var(--ink-soft); padding: 4px 0;
    display: flex; gap: 9px; align-items: baseline;
  }
  .contras div.row b {
    font-family: var(--mono); font-size: 11.5px; color: var(--danger); font-weight: 600;
    white-space: nowrap;
  }
  .contras div.row.perr b { color: var(--olive-ink); }

  /* assignments */
  details.assign { margin-top: 14px; }
  details.assign summary {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--olive-ink); cursor: pointer;
  }
  .tablewrap {
    overflow-x: auto; margin-top: 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface);
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); }
  th {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--olive-ink); font-weight: 600;
  }
  tr:last-child td { border-bottom: 0; }
  td.own { font-family: var(--mono); font-size: 12px; }

  /* empty state — a resolved answer, not a call to arms */
  .empty {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 46px 34px 38px; margin-top: 26px; position: relative; min-height: 150px;
  }
  .empty .verdict-line { font-weight: 600; font-size: 18px; line-height: 1.2; margin: 0; }
  .empty .arrow {
    position: absolute; left: 30px; bottom: 22px;
    font-size: 14px; color: var(--accent); text-decoration: none;
  }
  .empty .arrow:hover { text-decoration: underline; }

  footer { padding: 34px 0 60px; color: var(--ink-faint); font-size: 13px; }
  footer code { font-family: var(--mono); font-size: 12px; }

  @media (max-width: 640px) { .wrap { padding: 0 18px; } .board { gap: 40px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in">
    <span class="bar-mark">cc-dispatch · Plan Board</span>
    <nav class="bar-nav">
      <a href="/">Dashboard</a>
      <button id="refresh-chip" title="Refresh now">loading…</button>
    </nav>
  </div>
</div>

<header class="mast">
  <div class="wrap">
    <p class="eyebrow">Fleet coordination · /opt/cc-notes · read-only projection</p>
    <h1 id="headline">Reading the fleet<em>…</em></h1>
    <div class="kpis" id="kpis" hidden></div>
  </div>
</header>

<main class="wrap" id="root"></main>

<footer>
  <div class="wrap">
    <p>Rendered from <code>cc-plan json --all</code> (schema 1) · states and evidence are
    machine-verified claims, never inferred · archived plans live in
    <code>/opt/cc-notes/archive/</code> and the private mirror.</p>
  </div>
</footer>

<script>
"use strict";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const rel = (min) => min == null ? null
  : min < 1 ? "just now" : min < 60 ? `${min}m ago`
  : min < 1440 ? `${Math.round(min / 60)}h ago` : `${Math.round(min / 1440)}d ago`;
const ageBand = (min) => min == null ? "none" : min <= 20 ? "fresh" : min <= 120 ? "aging" : "stale";

function depTokens(sess) {
  return (sess.depends_on || "").split(/[^A-Za-z0-9._-]+/).filter(Boolean);
}
function depth(sess, all, seen) {
  if (seen.has(sess.name)) return 0;
  seen.add(sess.name);
  const deps = depTokens(sess);
  if (!deps.length) return 0;
  let d = 0;
  for (const other of all)
    if (other.name !== sess.name && deps.includes(other.name))
      d = Math.max(d, 1 + depth(other, all, new Set(seen)));
  return d;
}

function sessionCard(s) {
  const box = el("article", "sess " + (s.state || "unknown"));
  const top = el("div", "sess-top");
  top.append(el("span", "st", (s.state || "unknown").replace(/-/g, " ")));
  const fr = el("span", "fresh");
  fr.dataset.age = ageBand(s.note_age_min);
  fr.append(el("i"), document.createTextNode(rel(s.note_age_min) ?? (s.planned ? "not spawned" : "no notes")));
  top.append(fr);
  box.append(top);
  box.append(el("div", "nm", s.name));
  if (s.task) box.append(el("div", "tk", s.task));
  const meta = el("div", "meta");
  if (s.repo_branch) meta.append(el("span", null, s.repo_branch));
  if (s.ledger_state) meta.append(el("span", null, "ledger " + s.ledger_state));
  if (s.container) meta.append(el("span", null, s.container.startsWith("Up") ? "container up" : s.container.toLowerCase()));
  else if (!s.planned) meta.append(el("span", null, "no container"));
  for (const u of s.unblocks || []) {
    const cls = u.verified === true ? "ev-ok" : u.verified === false ? "ev-bad" : null;
    meta.append(el("span", cls, `⬆ ${u.name} · ${u.type}` +
      (u.verified === true ? " ✓" : u.verified === false ? " ✗" : "")));
  }
  if (meta.children.length) box.append(meta);
  return box;
}

const STATE_COLOR = { working: "var(--accent)", done: "var(--ok)", blocked: "var(--danger)" };

function renderGraph(p) {
  const wrap = el("div", "depwrap");
  const sessions = p.sessions || [];
  if (!sessions.length) { wrap.append(el("p", "tk", "No sessions in this plan.")); return wrap; }

  const depths = new Map(sessions.map((s) => [s.name, depth(s, sessions, new Set())]));
  const cols = new Map();
  for (const s of sessions) {
    const d = depths.get(s.name);
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(s);
  }
  const order = new Map();
  for (const d of [...cols.keys()].sort((a, b) => a - b)) {
    const list = cols.get(d);
    if (d > 0) list.sort((a, b) => {
      const bary = (s) => {
        const ps = depTokens(s).filter((n) => order.has(n)).map((n) => order.get(n));
        return ps.length ? ps.reduce((x, y) => x + y, 0) / ps.length : 0;
      };
      return bary(a) - bary(b);
    });
    list.forEach((s, i) => order.set(s.name, i));
  }

  const NW = 216, NH = 58, GX = 120, GY = 26, PAD = 16;
  const pos = new Map();
  for (const [d, list] of cols)
    list.forEach((s, i) => pos.set(s.name, { x: PAD + d * (NW + GX), y: PAD + 20 + i * (NH + GY) }));
  const maxD = Math.max(...cols.keys());
  const W = PAD * 2 + (maxD + 1) * NW + maxD * GX;
  const H = PAD * 2 + 24 + Math.max(...[...cols.values()].map((l) => l.length)) * (NH + GY) - GY;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "depgraph");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const mk = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const defs = mk("defs", {});
  for (const [id, color] of [["dg-ok", "var(--ok)"], ["dg-mut", "var(--line-strong)"]]) {
    const m = mk("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5,
                             markerWidth: 6.5, markerHeight: 6.5, orient: "auto" });
    const path = mk("path", { d: "M0 0L10 5L0 10z" });
    path.style.fill = color;
    m.append(path); defs.append(m);
  }
  svg.append(defs);

  for (const d of cols.keys()) {
    const hdr = mk("text", { x: PAD + d * (NW + GX), y: PAD + 6, "font-size": 10,
                             "letter-spacing": "0.12em" }, `WAVE ${d + 1}`);
    hdr.style.fill = "var(--ink-faint)";
    hdr.style.fontFamily = "var(--mono)";
    svg.append(hdr);
  }

  for (const s of sessions) {
    for (const dep of depTokens(s)) {
      if (!pos.has(dep) || dep === s.name) continue;
      const a = pos.get(dep), b = pos.get(s.name);
      const up = sessions.find((x) => x.name === dep);
      const okEdge = up && up.state === "done";
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x - 7, y2 = b.y + NH / 2;
      const mx = (x1 + x2) / 2;
      const path = mk("path", {
        d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`,
        fill: "none", "stroke-width": 1.7,
        "marker-end": okEdge ? "url(#dg-ok)" : "url(#dg-mut)",
      });
      path.style.stroke = okEdge ? "var(--ok)" : "var(--line-strong)";
      if (!okEdge) path.setAttribute("stroke-dasharray", "5 4");
      svg.append(path);
      const art = (up && up.unblocks || [])[0];
      if (art) {
        const lbl = mk("text", { x: mx, y: (y1 + y2) / 2 - 6, "font-size": 9.5,
                                 "text-anchor": "middle" },
          `${art.name}${art.verified === true ? " ✓" : art.verified === false ? " ✗" : ""}`);
        lbl.style.fill = art.verified === false ? "var(--danger)" : okEdge ? "var(--ok)" : "var(--ink-faint)";
        lbl.style.fontFamily = "var(--mono)";
        svg.append(lbl);
      }
    }
  }

  for (const s of sessions) {
    const { x, y } = pos.get(s.name);
    const g = mk("g", {});
    const box = mk("rect", { x, y, width: NW, height: NH, rx: 8 });
    box.style.fill = "var(--ground)";
    box.style.stroke = STATE_COLOR[s.state] || "var(--line-strong)";
    box.style.strokeWidth = "1.4";
    if (s.state === "waiting-to-spawn") box.setAttribute("stroke-dasharray", "5 4");
    g.append(box);
    const dot = mk("circle", { cx: x + 14, cy: y + 17, r: 4 });
    dot.style.fill = STATE_COLOR[s.state] || "var(--ink-faint)";
    g.append(dot);
    const stl = mk("text", { x: x + 24, y: y + 21, "font-size": 9.5, "letter-spacing": "0.08em" },
      (s.state || "unknown").replace(/-/g, " ").toUpperCase());
    stl.style.fill = STATE_COLOR[s.state] || "var(--ink-faint)";
    stl.style.fontFamily = "var(--mono)";
    g.append(stl);
    const age = rel(s.note_age_min);
    if (age) {
      const at = mk("text", { x: x + NW - 10, y: y + 21, "font-size": 9.5, "text-anchor": "end" }, age);
      at.style.fill = "var(--ink-faint)";
      at.style.fontFamily = "var(--mono)";
      g.append(at);
    }
    const name = s.name.length > 30 ? s.name.slice(0, 29) + "…" : s.name;
    const nt = mk("text", { x: x + 14, y: y + 42, "font-size": 11.5 }, name);
    nt.style.fill = "var(--ink)";
    nt.style.fontFamily = "var(--mono)";
    g.append(nt);
    g.append(mk("title", {}, s.name + "\n" + (s.task || "") + "\n" + (s.repo_branch || "")));
    svg.append(g);
  }
  wrap.append(svg);
  const nEdges = sessions.reduce((n, s) => n + depTokens(s).filter((d) => pos.has(d) && d !== s.name).length, 0);
  if (!nEdges) wrap.append(el("p", "plan-meta", "no dependencies — fully parallel wave"));
  return wrap;
}

function renderPlan(p) {
  const card = el("section", "plan");
  const head = el("div", "plan-head");
  const h = el("h2"); h.append(el("span", null, p.plan)); head.append(h);
  const st = (p.status || "?").split(" ")[0];
  head.append(el("span", "badge st-" + (st === "active" ? "active" : "closed"), p.status || "unknown"));
  if (p.orchestrator) head.append(el("span", "badge plain", "orch · " + p.orchestrator));
  card.append(head);
  if (p.error) { card.append(el("p", "tk", p.error)); return card; }
  if (p.goal) card.append(el("p", "goal", p.goal));
  card.append(el("p", "plan-meta", "generated " + (p.generated_at || "?") + " UTC"));

  const board = el("div", "board");
  const cols = new Map(), boxes = new Map();
  for (const s of p.sessions || []) {
    const d = depth(s, p.sessions, new Set());
    if (!cols.has(d)) {
      const c = el("div", "col");
      c.append(el("span", "col-k", d === 0 ? "wave · independent" : "after wave " + d));
      cols.set(d, c);
    }
    const box = sessionCard(s);
    cols.get(d).append(box);
    boxes.set(s.name, { box, sess: s });
  }
  for (const d of [...cols.keys()].sort((a, b) => a - b)) board.append(cols.get(d));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges");
  board.append(svg);

  // list | graph toggle (persisted per plan; graph = the dependency diagram)
  const viewKey = "ccview-" + p.plan;
  let view; try { view = localStorage.getItem(viewKey) || "list"; } catch { view = "list"; }
  const toggle = el("div", "vtoggle");
  const bList = el("button", view === "list" ? "on" : "", "list");
  const bGraph = el("button", view === "graph" ? "on" : "", "graph");
  toggle.append(bList, bGraph);
  head.append(toggle);
  const body = el("div");
  const show = (v) => {
    view = v;
    try { localStorage.setItem(viewKey, v); } catch {}
    bList.className = v === "list" ? "on" : "";
    bGraph.className = v === "graph" ? "on" : "";
    body.replaceChildren(v === "graph" ? renderGraph(p) : board);
    if (v === "list") drawEdges();
  };
  bList.addEventListener("click", () => show("list"));
  bGraph.addEventListener("click", () => show("graph"));
  card.append(body);
  body.append(view === "graph" ? renderGraph(p) : board);

  const contras = (p.contradictions || []), perrs = (p.parser_errors || []);
  if (contras.length || perrs.length) {
    const c = el("div", "contras");
    c.append(el("div", "kicker", "Needs attention"));
    for (const x of contras) {
      const row = el("div", "row");
      row.append(el("b", null, x.kind), el("span", null, `${x.session} — ${x.detail}`));
      c.append(row);
    }
    for (const x of perrs) {
      const row = el("div", "row perr");
      row.append(el("b", null, "protocol"), el("span", null, x));
      c.append(row);
    }
    card.append(c);
  }

  if ((p.assignments || []).length) {
    const det = el("details", "assign");
    det.append(el("summary", null, `Assignments · ${p.assignments.length}`));
    const wrapT = el("div", "tablewrap"), tbl = el("table");
    const thead = el("thead"), hr = el("tr");
    hr.append(el("th", null, "Area / surface"), el("th", null, "Owner"));
    thead.append(hr); tbl.append(thead);
    const tb = el("tbody");
    for (const a of p.assignments) {
      const tr = el("tr");
      tr.append(el("td", null, a.area), el("td", "own", a.owner));
      tb.append(tr);
    }
    tbl.append(tb); wrapT.append(tbl); det.append(wrapT); card.append(det);
  }

  const drawEdges = () => requestAnimationFrame(() => {
    if (!board.isConnected) return;
    const br = board.getBoundingClientRect();
    svg.setAttribute("width", board.scrollWidth);
    svg.setAttribute("height", board.scrollHeight);
    const defs = document.createElementNS(svg.namespaceURI, "defs");
    defs.innerHTML = '<marker id="arr-' + p.plan + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>';
    svg.append(defs);
    svg.style.color = getComputedStyle(document.documentElement).getPropertyValue("--accent-edge").trim() || "currentColor";
    for (const { box, sess } of boxes.values()) {
      const deps = depTokens(sess);
      if (!deps.length) continue;
      for (const [oname, o] of boxes) {
        if (oname === sess.name || !deps.includes(oname)) continue;
        const a = o.box.getBoundingClientRect(), b = box.getBoundingClientRect();
        const x1 = a.right - br.left + board.scrollLeft, y1 = a.top + a.height / 2 - br.top;
        const x2 = b.left - br.left + board.scrollLeft - 7, y2 = b.top + b.height / 2 - br.top;
        const mx = (x1 + x2) / 2;
        const path = document.createElementNS(svg.namespaceURI, "path");
        path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "1.6");
        path.setAttribute("marker-end", `url(#arr-${p.plan})`);
        svg.append(path);
      }
    }
  });
  if (view === "list") drawEdges();
  return card;
}

function kpiTile(n, label, tone) {
  const t = el("div", "kpi");
  if (tone) t.dataset.tone = tone;
  t.append(el("div", "n", String(n)), el("div", "k", label));
  return t;
}

function headline(plans, counts) {
  const h = document.getElementById("headline");
  h.replaceChildren();
  if (!plans.length) { h.append("Nothing ", Object.assign(el("em"), { textContent: "in flight." })); return; }
  const n = plans.length === 1 ? "One plan" : plans.length === 2 ? "Two plans" :
            plans.length === 3 ? "Three plans" : `${plans.length} plans`;
  h.append(n + " ", Object.assign(el("em"), { textContent: "in flight." }));
  if (counts.blocked > 0 || counts.attention > 0) {
    h.replaceChildren(n + " in flight — ", Object.assign(el("em"), {
      textContent: counts.blocked ? "one needs you." : "worth a look.",
    }));
  }
}

let timer = 30, ticking = null;
async function refresh() {
  const chip = document.getElementById("refresh-chip");
  try {
    const r = await fetch("/api/plans");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const plans = await r.json();
    const counts = { working: 0, done: 0, blocked: 0, waiting: 0, attention: 0 };
    for (const p of plans) {
      counts.attention += (p.contradictions || []).length + (p.parser_errors || []).length;
      for (const s of p.sessions || []) {
        if (s.state === "working") counts.working++;
        else if (s.state === "done") counts.done++;
        else if (s.state === "blocked") counts.blocked++;
        else if (s.state === "waiting-to-spawn") counts.waiting++;
      }
    }
    headline(plans, counts);
    const kpis = document.getElementById("kpis");
    kpis.hidden = !plans.length;
    kpis.replaceChildren(
      kpiTile(plans.length, "plans", null),
      kpiTile(counts.working, "working", "accent"),
      kpiTile(counts.done, "done", "ok"),
      kpiTile(counts.blocked, "blocked", counts.blocked ? "danger" : null),
      kpiTile(counts.waiting, "waiting to spawn", null),
      kpiTile(counts.attention, "need attention", counts.attention ? "danger" : "ok"),
    );
    const root = document.getElementById("root");
    root.replaceChildren();
    if (!plans.length) {
      const e = el("div", "empty");
      e.append(el("p", "verdict-line", "Nothing in flight."));
      const a = el("a", "arrow", "Design a plan in a client repo →");
      a.href = "/";
      e.append(a);
      root.append(e);
    }
    for (const p of plans) root.append(renderPlan(p));
    chip.dataset.err = "0";
    timer = 30;
  } catch (err) {
    chip.dataset.err = "1";
    chip.textContent = "offline · retrying";
    timer = 15;
  }
}
function tick() {
  const chip = document.getElementById("refresh-chip");
  timer -= 1;
  if (chip.dataset.err !== "1")
    chip.textContent = `updated ${new Date().toLocaleTimeString()} · ${timer}s`;
  if (timer <= 0) { refresh(); }
}
document.getElementById("refresh-chip").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
ticking = setInterval(tick, 1000);
</script>
</body>
</html>
