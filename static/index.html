<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* ForHumans design system tokens (design-system-handoff, 27 Aug 2026) */
  :root {
    --ground: #f7f7f7; --surface: #ffffff; --surface-2: #f2eee3;
    --ink: #21021d; --ink-soft: #4a4548; --ink-faint: #7c757a;
    --line: #e3ded4; --line-strong: #cfc9bc;
    --accent: #6559c0; --accent-soft: #ddd8fe; --accent-edge: #c1b9fe;
    --olive: #a3a180; --olive-ink: #5f5d43;
    --danger: #b3261e; --ok: #3c7a5e;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #170114; --surface: #21021d; --surface-2: #2a0a26;
      --ink: #eae3d2; --ink-soft: #bdb3a4; --ink-faint: #8e8378;
      --line: #3a1f36; --line-strong: #553550;
      --accent: #c1b9fe; --accent-soft: #33266b; --accent-edge: #5c4bb0;
      --olive: #a3a180; --olive-ink: #b3b190;
      --danger: #ef8b84; --ok: #7dc0a1;
    }
  }
  :root[data-theme="dark"] {
    --ground: #170114; --surface: #21021d; --surface-2: #2a0a26;
    --ink: #eae3d2; --ink-soft: #bdb3a4; --ink-faint: #8e8378;
    --line: #3a1f36; --line-strong: #553550;
    --accent: #c1b9fe; --accent-soft: #33266b; --accent-edge: #5c4bb0;
    --olive: #a3a180; --olive-ink: #b3b190;
    --danger: #ef8b84; --ok: #7dc0a1;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  /* ── top bar ── */
  header {
    padding: 0 20px; height: 52px; flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  header h1 { font-family: var(--serif); font-size: 19px; font-weight: 400; letter-spacing: -0.01em; }
  .host-badge {
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 4px 12px;
    font-size: 11.5px; color: var(--ink-soft); font-family: var(--mono);
  }
  header .subtitle {
    color: var(--olive-ink); font-size: 11px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  header .spacer { flex: 1; }
  .bar-link {
    font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none; padding: 6px 12px;
    border-radius: 999px; border: 1px solid transparent;
  }
  .bar-link:hover { border-color: var(--line-strong); color: var(--ink); }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── session list ── */
  .sidebar {
    width: 280px; min-width: 210px; border-right: 1px solid var(--line);
    overflow-y: auto; padding: 14px 10px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--ground);
  }
  .side-kicker {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--olive-ink); padding: 2px 8px 6px;
  }
  .session-card {
    padding: 11px 13px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface);
    transition: border-color 0.12s;
  }
  .session-card:hover { border-color: var(--line-strong); }
  .session-card.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .session-title {
    font-family: var(--mono); font-weight: 500; font-size: 12.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--ink-faint); }
  .status-dot.running { background: var(--ok); }
  .status-dot.busy { background: var(--olive); }
  .agent-badge {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--ink-faint);
  }
  .agent-badge.claude { color: var(--accent); }
  .agent-badge.opencode { color: var(--olive-ink); }
  .agent-badge.codex { color: var(--ok); }
  .session-group {
    font-size: 10.5px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .session-tool { font-size: 11px; color: var(--ink-faint); margin-left: auto; font-family: var(--mono); }
  .empty-sidebar {
    color: var(--ink-soft); text-align: center; padding: 34px 12px 28px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
  }
  .empty-sidebar .v { font-family: var(--serif); font-size: 21px; line-height: 1.15; }
  .empty-sidebar .a { display: block; margin-top: 12px; font-size: 12.5px; color: var(--accent); }

  /* ── compose panel ── */
  .compose { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .compose-header { padding: 16px 24px 14px; border-bottom: 1px solid var(--line); }
  .compose-title {
    font-family: var(--mono); font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .compose-path {
    font-size: 11px; color: var(--ink-faint); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px;
  }
  .compose-body { flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 16px; overflow-y: auto; }
  .no-session {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .no-session .card {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 42px 38px 34px; position: relative; min-width: min(420px, 90%);
  }
  .no-session .v { font-family: var(--serif); font-size: 27px; line-height: 1.1; }
  .no-session .a { margin-top: 16px; font-size: 13.5px; color: var(--accent); }

  .prompt-wrap { display: flex; flex-direction: column; gap: 10px; }
  .prompt-wrap label, .field label {
    font-family: var(--mono); font-size: 10.5px; color: var(--olive-ink);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em;
  }
  textarea {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 12px; color: var(--ink);
    font-size: 14.5px; font-family: var(--sans);
    padding: 13px 15px; resize: vertical; min-height: 130px;
    outline: none; transition: border-color 0.15s; line-height: 1.55;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--ink-faint); }

  .send-row { display: flex; justify-content: flex-end; gap: 12px; align-items: center; }
  .hint { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
  .send-btn {
    background: var(--accent); color: var(--ground); border: none;
    border-radius: 999px; padding: 9px 22px;
    font-size: 13.5px; font-weight: 600; font-family: var(--sans);
    cursor: pointer; transition: opacity 0.15s;
  }
  .send-btn:hover { opacity: 0.88; }
  .send-btn:disabled { opacity: 0.35; cursor: default; }

  /* ── drop zone ── */
  .dropzone {
    border: 2px dashed var(--line-strong); border-radius: 12px;
    padding: 24px 20px; text-align: center; color: var(--ink-faint);
    font-size: 13px; cursor: pointer; position: relative;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent); background: var(--accent-soft); color: var(--ink);
  }
  .dropzone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .image-preview {
    display: flex; align-items: center; gap: 12px;
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px;
  }
  .image-preview img {
    width: 48px; height: 48px; object-fit: cover;
    border-radius: 6px; border: 1px solid var(--line);
  }
  .image-preview .img-name {
    font-size: 12px; color: var(--ink-soft); flex: 1; font-family: var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .image-preview .clear-img {
    background: none; border: none; color: var(--ink-faint);
    cursor: pointer; font-size: 16px; padding: 0 4px;
  }
  .image-preview .clear-img:hover { color: var(--danger); }

  /* ── PageFab — the one primary create action, bottom-right ── */
  .fab {
    position: fixed; bottom: 22px; right: 22px; z-index: 90;
    width: 52px; height: 52px; border-radius: 999px; border: none;
    background: var(--ink); color: var(--ground);
    font-size: 26px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    transition: transform 0.12s;
  }
  .fab:hover { transform: translateY(-2px); }
  .fab-hint {
    position: fixed; bottom: 34px; right: 86px; z-index: 90;
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint); pointer-events: none;
  }

  /* ── toast ── */
  #toast {
    position: fixed; bottom: 88px; right: 24px; z-index: 100;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 9px 18px; font-size: 13px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok   { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  #toast.err  { border-color: var(--danger); color: var(--danger); font-weight: 600; }
  #toast.warn { border-color: var(--olive); color: var(--olive-ink); max-width: 420px; border-radius: 12px; font-weight: 500; }

  /* ── modal ── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: color-mix(in srgb, var(--ink) 42%, transparent);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 26px; width: 380px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .modal h2 { font-family: var(--serif); font-size: 26px; font-weight: 400; line-height: 1.05; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field input, .field select {
    background: var(--ground); border: 1px solid var(--line);
    border-radius: 10px; color: var(--ink); font-size: 14px; font-family: var(--sans);
    padding: 10px 13px; outline: none; transition: border-color 0.15s;
    width: 100%; appearance: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--ink-faint); }
  .repo-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 300;
    background: var(--surface); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto;
  }
  .repo-list-item { padding: 8px 13px; cursor: pointer; font-size: 13px; }
  .repo-list-item:hover, .repo-list-item.highlighted { background: var(--accent-soft); color: var(--ink); }
  .repo-list-item .repo-owner { color: var(--ink-faint); font-size: 11.5px; }
  .field-wrap { position: relative; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .cancel-btn {
    background: none; border: 1px solid var(--line-strong); color: var(--ink-soft);
    border-radius: 999px; padding: 8px 18px; font-size: 13px; font-family: var(--sans); cursor: pointer;
  }
  .cancel-btn:hover { border-color: var(--ink); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>cc-dispatch</h1>
  <span class="host-badge" id="host-badge">…</span>
  <span class="subtitle" id="session-count">loading…</span>
  <div class="spacer"></div>
  <a class="bar-link" href="/plans.html">Plan Board</a>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="compose" id="compose">
    <div class="no-session"><div class="card"><p class="v">No session selected.</p><p class="a">Pick one on the left →</p></div></div>
  </main>
</div>

<button class="fab" onclick="openModal()" title="New session (n)" aria-label="New session">+</button>
<span class="fab-hint">n</span>

<div id="toast"></div>

<!-- New session modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>New session</h2>
    <div class="field">
      <label>Repo</label>
      <div class="field-wrap">
        <input id="new-repo" placeholder="Search repos…" autocomplete="off"
               oninput="filterRepos(this.value)" onfocus="showRepoList()" onblur="hideRepoList()">
        <div class="repo-list" id="repo-list" style="display:none"></div>
      </div>
    </div>
    <div class="field">
      <label>Branch <span id="branch-hint" style="color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0"></span></label>
      <div class="field-wrap">
        <input id="new-branch" placeholder="new-branch-name" autocomplete="off" list="branch-datalist">
        <datalist id="branch-datalist"></datalist>
      </div>
    </div>
    <div class="field">
      <label>Agent</label>
      <select id="new-agent"><option value="claude">claude (ccd)</option></select>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="send-btn" onclick="createSession()">Spawn</button>
    </div>
  </div>
</div>

<script>
let sessions = [];
let activeId = null;
let pendingImage = null;

// ── Fetch sessions ──────────────────────────────────────────────────────────

async function fetchSessions() {
  try {
    const data = await fetch('/api/sessions').then(r => r.json());
    sessions = data;
    renderSidebar();
  } catch (e) {
    console.error('fetch sessions failed', e);
  }
}

fetch('/api/host').then(r => r.json()).then(d => {
  document.getElementById('host-badge').textContent = d.host;
});

setInterval(fetchSessions, 5000);
fetchSessions();

// ── Which agent CLI drives a session — mirrors agent_kind() in main.py ──────
// cc-spawn -> work/Claude Code · cc-arch|cc-code -> arch|code/OpenCode ·
// cc-codex -> codex/Codex. Group first, name suffix as fallback.
const GROUP_KINDS = { work: 'claude', arch: 'opencode', code: 'opencode', codex: 'codex' };

// Returns '' when the metadata doesn't say — sessions get regrouped and agents
// get launched by hand (e.g. a Codex session in group "Foraudits"), and a
// confidently wrong badge is worse than none. The selected session gets the
// truth from /agent, which reads the live pane.
function agentKind(s) {
  if (s.agent_hint) return s.agent_hint;
  const g = (s.group || '').trim().toLowerCase();
  if (GROUP_KINDS[g]) return GROUP_KINDS[g];
  const t = (s.title || '').trim().toLowerCase();
  if (t.endsWith('-arch') || t.endsWith('-code')) return 'opencode';
  if (t.endsWith('-codex')) return 'codex';
  return '';
}

// ── Render sidebar ──────────────────────────────────────────────────────────

function renderSidebar() {
  const el = document.getElementById('sidebar');
  const count = document.getElementById('session-count');
  count.textContent = `${sessions.length} session${sessions.length !== 1 ? 's' : ''}`;

  if (!sessions.length) {
    el.innerHTML = '<div class="empty-sidebar"><p class="v">No sessions running.</p><span class="a">Spawn one with the + button →</span></div>';
    return;
  }

  el.innerHTML = '<div class="side-kicker">Sessions</div>' + sessions.map(s => `
    <div class="session-card ${s.id === activeId ? 'active' : ''}" onclick="selectSession('${s.id}')">
      <div class="session-title" title="${s.title}">${s.title}</div>
      <div class="session-meta">
        <div class="status-dot ${s.status || 'idle'}"></div>
        ${agentKind(s) ? `<span class="agent-badge ${agentKind(s)}">${agentKind(s)}</span>` : ''}
        <span class="session-group">${s.group || ''}</span>
        <span class="session-tool">${s.tool || ''}</span>
      </div>
    </div>
  `).join('');
}

// ── Select session ──────────────────────────────────────────────────────────

function selectSession(id) {
  activeId = id;
  pendingImage = null;
  renderSidebar();
  renderCompose();
}

function renderCompose() {
  const session = sessions.find(s => s.id === activeId);
  const compose = document.getElementById('compose');

  if (!session) {
    compose.innerHTML = '<div class="no-session"><div class="card"><p class="v">No session selected.</p><p class="a">Pick one on the left →</p></div></div>';
    return;
  }

  compose.innerHTML = `
    <div class="compose-header">
      <div>
        <div class="compose-title">${session.title} <span class="agent-badge ${agentKind(session)}" id="agent-badge">${agentKind(session) || '…'}</span></div>
        <div class="compose-path">${session.path}</div>
      </div>
    </div>
    <div class="compose-body">

      <div class="prompt-wrap">
        <label>Prompt</label>
        <textarea id="prompt-input" placeholder="Type a prompt… (Ctrl+Enter to send)" rows="5"></textarea>
        <div id="image-area">
          <div class="dropzone" id="dropzone"
               ondragover="onDragOver(event)"
               ondragleave="onDragLeave(event)"
               ondrop="onDrop(event)">
            <input type="file" accept="image/*" onchange="onFileSelect(event)">
            <div>Drop / paste (Ctrl+V) an image — optional</div>
          </div>
        </div>
        <div class="send-row">
          <span class="hint" id="send-hint">Ctrl+Enter</span>
          <button class="send-btn" id="send-btn" onclick="sendAll()">Send</button>
        </div>
      </div>

    </div>
  `;

  // Replace the metadata guess with what's actually running in the pane.
  fetch(`/api/sessions/${session.id}/agent`)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      const badge = document.getElementById('agent-badge');
      if (!d || !badge || activeId !== session.id) return;
      badge.textContent = d.agent;
      badge.className = `agent-badge ${d.agent}`;
      badge.title = d.source === 'pane' ? 'detected from the live session' : 'guessed from the agent-deck group';
    })
    .catch(() => {});

  // Ctrl+Enter on textarea
  document.getElementById('prompt-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendAll();
    }
  });
}

// ── Unified send (text + optional image — always one message) ────────────────

async function sendAll() {
  if (!activeId) return;
  const input  = document.getElementById('prompt-input');
  const prompt = input.value.trim();
  const btn    = document.getElementById('send-btn');

  if (!prompt && !pendingImage) return;
  btn.disabled = true;

  try {
    if (pendingImage) {
      const form = new FormData();
      form.append('file', pendingImage);
      if (prompt) form.append('prompt', prompt);
      const res = await fetch(`/api/sessions/${activeId}/image`, { method: 'POST', body: form });
      if (!res.ok) throw new Error(await errText(res));
      const data = await res.json();
      // data.note warns when the target CLI's model can't actually see images
      // (OpenCode's default fleet models are text-only) — surface it instead of
      // letting the send look successful and the agent answer "I can't view it".
      if (data.note) toast(data.note, 'warn');
      else toast(`Sent → ${data.path}`, 'ok');
      clearImage();
    } else {
      const res = await fetch(`/api/sessions/${activeId}/prompt`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      if (!res.ok) throw new Error(await errText(res));
      toast('Sent ✓', 'ok');
    }
    input.value = '';
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

// FastAPI errors arrive as {"detail": "..."} — show the sentence, not the JSON.
// The send routes refuse with a 409 whose detail says what to do about it
// (agent not running / still launching), so it needs to be readable in the toast.
async function errText(res) {
  const raw = await res.text();
  try { return JSON.parse(raw).detail || raw; } catch { return raw; }
}

// ── Image drag & drop ───────────────────────────────────────────────────────

function onDragOver(e) {
  e.preventDefault();
  document.getElementById('dropzone')?.classList.add('drag-over');
}

function onDragLeave(e) {
  document.getElementById('dropzone')?.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone')?.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) setImage(file);
}

function onFileSelect(e) {
  const file = e.target.files[0];
  if (file) setImage(file);
}

function setImage(file) {
  pendingImage = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('image-area').innerHTML = `
      <div class="image-preview">
        <img src="${ev.target.result}" alt="preview">
        <span class="img-name">${file.name}</span>
        <button class="clear-img" onclick="clearImage()" title="Remove">✕</button>
      </div>
    `;
    document.getElementById('send-btn').textContent = 'Send +image';
    document.getElementById('send-hint').textContent = 'text above is optional';
  };
  reader.readAsDataURL(file);
}

// Ctrl+V anywhere on the page — grab image from clipboard
document.addEventListener('paste', e => {
  if (!activeId) return;
  const items = Array.from(e.clipboardData?.items || []);
  const imgItem = items.find(i => i.type.startsWith('image/'));
  if (!imgItem) return;
  e.preventDefault();
  const file = imgItem.getAsFile();
  if (file) setImage(new File([file], `paste-${Date.now()}.png`, { type: file.type }));
});

function clearImage() {
  pendingImage = null;
  document.getElementById('image-area').innerHTML = `
    <div class="dropzone" id="dropzone"
         ondragover="onDragOver(event)"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event)">
      <input type="file" accept="image/*" onchange="onFileSelect(event)">
      <div>Drop / paste (Ctrl+V) an image — optional</div>
    </div>
  `;
  document.getElementById('send-btn').textContent = 'Send';
  document.getElementById('send-hint').textContent = 'Ctrl+Enter';
}


// ── New session modal ───────────────────────────────────────────────────────

let allRepos = [];
let selectedRepo = null; // { name, owner, full_name, default_branch }
let agentsLoaded = false;

async function openModal() {
  document.getElementById('modal-backdrop').classList.add('open');
  document.getElementById('new-repo').value = '';
  document.getElementById('new-branch').value = '';
  document.getElementById('branch-hint').textContent = '';
  document.getElementById('branch-datalist').innerHTML = '';
  selectedRepo = null;
  setTimeout(() => document.getElementById('new-repo').focus(), 50);

  if (!allRepos.length) {
    try {
      allRepos = await fetch('/api/github/repos').then(r => r.json());
    } catch(e) { /* gh not available, manual input still works */ }
  }

  if (!agentsLoaded) {
    try {
      const agents = await fetch('/api/agents').then(r => r.json());
      document.getElementById('new-agent').innerHTML = Object.entries(agents)
        .map(([kind, cmd]) => `<option value="${kind}">${kind} (${cmd})</option>`).join('');
      agentsLoaded = true;
    } catch(e) { /* keep the hardcoded claude option */ }
  }
}

// 'n' spawns — the FAB's one-key shortcut (never while typing somewhere)
document.addEventListener('keydown', e => {
  if (e.key !== 'n' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = document.activeElement?.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (document.getElementById('modal-backdrop').classList.contains('open')) return;
  e.preventDefault();
  openModal();
});

function filterRepos(q) {
  selectedRepo = null;

  const list = document.getElementById('repo-list');
  const matches = q.length < 1
    ? allRepos.slice(0, 30)
    : allRepos.filter(r => r.full_name.toLowerCase().includes(q.toLowerCase())).slice(0, 30);

  list.innerHTML = matches.map((r, i) => `
    <div class="repo-list-item" data-idx="${i}" data-full="${r.full_name}"
         onmousedown="pickRepo(${allRepos.indexOf(r)})">
      <span class="repo-owner">${r.owner}/</span>${r.name}
    </div>
  `).join('') || '<div class="repo-list-item" style="color:var(--ink-faint)">No matches</div>';
  list.style.display = 'block';
}

function showRepoList() {
  filterRepos(document.getElementById('new-repo').value);
}

function hideRepoList() {
  setTimeout(() => {
    document.getElementById('repo-list').style.display = 'none';
  }, 150);
}

async function pickRepo(idx) {
  selectedRepo = allRepos[idx];
  document.getElementById('new-repo').value = selectedRepo.full_name;
  // Don't hide the list here — hiding during mousedown (before mouseup/click fire)
  // can cause the click event to land on the backdrop and close the modal.
  // The onblur timeout on the input handles hiding with proper timing.

  const inp = document.getElementById('new-branch');
  const hint = document.getElementById('branch-hint');
  const dl = document.getElementById('branch-datalist');

  inp.value = '';
  inp.focus();
  hint.textContent = '(loading existing…)';
  dl.innerHTML = '';

  try {
    const branches = await fetch(
      `/api/github/repos/${selectedRepo.owner}/${selectedRepo.name}/branches`
    ).then(r => r.json());
    dl.innerHTML = branches.map(b => `<option value="${b}">`).join('');
    hint.textContent = `— ${branches.length} existing`;
  } catch(e) {
    hint.textContent = '';
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-backdrop')) return;
  document.getElementById('modal-backdrop').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-backdrop').classList.remove('open');
});

async function createSession() {
  const repoInput = document.getElementById('new-repo').value.trim();
  // Always send owner/repo so the backend can build the correct git URL for cross-org repos.
  const repo = selectedRepo ? selectedRepo.full_name : repoInput;

  const branch = document.getElementById('new-branch').value.trim();

  if (!repo || !branch) {
    toast('Pick a repo and branch', 'err');
    return;
  }

  try {
    const res = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo, branch, agent: document.getElementById('new-agent').value }),
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('modal-backdrop').classList.remove('open');
    toast(`Spawning ${repo} / ${branch}…`, 'ok');
    setTimeout(fetchSessions, 3000);
  } catch (e) {
    toast('Error: ' + e.message, 'err');
  }
}

// ── Toast ───────────────────────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}
</script>
